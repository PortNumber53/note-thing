root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/note-thing ."
entrypoint = ["./tmp/note-thing", "serve"]
delay = 1000
exclude_dir = ["tmp", "migrations"]
include_ext = ["go", "tpl", "tmpl", "html"]
stop_on_error = true

[log]
time = true

[color]
main = "yellow"
watcher = "cyan"
build = "green"
runner = "magenta"
