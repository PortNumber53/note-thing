name: note_thing_mobile
description: "Note Thing - Evernote clone mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  google_sign_in: ^6.2.2
  flutter_secure_storage: ^9.2.4
  go_router: ^14.8.1
  flutter_markdown: ^0.7.6
  intl: ^0.19.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
